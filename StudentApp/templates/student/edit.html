{% extends 'base.html' %}

{% block style %}
    body { background-color: #e8f5e9; }
    .card-header { background-color: #0400ff; color: white; }
{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-primary">
            <div class="card-header">
                <h4 class="mb-0 text-center align-middle">Update Student </h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Student Name</label>
                        <input type="text" name="name" class="form-control border-primary" 
                               value="{{ student.name }}" >
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Update Student</button>
                        <a href="{% url 'student_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
